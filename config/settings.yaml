system:
  local_only: true
  max_retries_per_task: 3
  max_replans: 2
  default_timeout_seconds: 90
  enforce_json_mode: true
  max_executor_steps: 20
  context_max_files: 500
  context_max_depth: 6
  database_path: .runtime/state.db
  artifact_directory: .runtime/artifacts

scheduler:
  max_parallel_tasks: 4
  max_parallel_writers: 2
  fail_fast: false
  apply_changes: true

models:
  planner:
    provider: ollama
    model_name: qwen2.5-coder:14b
    api_base: http://localhost:11434
    temperature: 0.1
  executor:
    provider: ollama
    model_name: qwen2.5-coder:7b-instruct
    api_base: http://localhost:11434
    temperature: 0.2
  reviewer:
    provider: ollama
    model_name: qwen2.5-coder:7b-instruct
    api_base: http://localhost:11434
    temperature: 0.0

cloud_fallback:
  enabled: false

